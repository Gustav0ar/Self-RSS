name: Android CI

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/android/**'
      - 'packages/api/openapi.json'
      - 'packages/shared/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'packages/android/**'
      - 'packages/api/openapi.json'
      - 'packages/shared/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

jobs:
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Android unit tests
        run: ./packages/android/gradlew -p packages/android :app:testDeviceTestUnitTest

  android-build-check:
    name: Android Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Android lint
        run: ./packages/android/gradlew -p packages/android :app:lintDebug
      - name: Assemble Android debug
        run: ./packages/android/gradlew -p packages/android :app:assembleDebug
      - name: Assemble Android release
        env:
          SELF_FEED_API_BASE_URL: https://example.invalid/api/v1/
        run: ./packages/android/gradlew -p packages/android :app:assembleRelease

  android-instrumentation:
    name: Android Instrumentation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Compose behavior tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./packages/android/gradlew -p packages/android :app:connectedDeviceTestAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.selffeed.android.ui.components.ReaderHtmlMediaStabilityTest
            ./packages/android/gradlew -p packages/android :app:connectedDeviceTestAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.selffeed.android.ui.components.ReaderHtmlMediaStabilityTest

  android-baseline-profile:
    name: Android Baseline Profile
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SELF_FEED_API_BASE_URL: https://example.invalid/api/v1/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate the release Baseline Profile on a managed device
        run: ./packages/android/gradlew -p packages/android :app:generateBaselineProfile -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile
      - name: Upload generated profile
        uses: actions/upload-artifact@v4
        with:
          name: android-baseline-profile
          path: packages/android/app/src/release/generated/baselineProfiles/baseline-prof.txt
          if-no-files-found: error
