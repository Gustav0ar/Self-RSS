name: Android CI

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/android/**'
      - 'packages/api/openapi.json'
      - 'packages/shared/**'
      - 'scripts/android-check.sh'
      - 'scripts/check-android-release-r8.sh'
      - 'scripts/verify-android-release-startup.sh'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'packages/android/**'
      - 'packages/api/openapi.json'
      - 'packages/shared/**'
      - 'scripts/android-check.sh'
      - 'scripts/check-android-release-r8.sh'
      - 'scripts/verify-android-release-startup.sh'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
    inputs:
      android_version_code:
        description: Positive, monotonically increasing Android version code
        required: true
        type: string
      android_version_name:
        description: Nonblank Android release version name
        required: true
        type: string

env:
  SELF_FEED_ANDROID_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.android_version_code || '1000000' }}
  SELF_FEED_ANDROID_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.android_version_name || format('ci.{0}', github.run_number) }}

jobs:
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Android unit tests
        run: ./packages/android/gradlew -p packages/android :app:testDeviceTestUnitTest

  android-build-check:
    name: Android Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Android lint
        run: ./packages/android/gradlew -p packages/android :app:lintDebug
      - name: Assemble Android debug
        run: ./packages/android/gradlew -p packages/android :app:assembleDebug
      - name: Assemble and verify Android release version
        env:
          SELF_FEED_API_BASE_URL: https://example.invalid/api/v1/
        run: |
          ./packages/android/gradlew -p packages/android \
            :app:verifyAndroidReleaseVersion \
            :app:printAndroidVersionMetadata

  android-instrumentation:
    name: Android Instrumentation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose behavior tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            ./packages/android/gradlew -p packages/android :app:connectedDeviceTestAndroidTest
            SELF_FEED_API_BASE_URL=https://example.invalid/api/v1/ ./scripts/verify-android-release-startup.sh

  android-baseline-profile:
    name: Android Baseline Profile
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SELF_FEED_API_BASE_URL: https://example.invalid/api/v1/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate the release Baseline Profile on a managed device
        run: ./packages/android/gradlew -p packages/android :app:generateBaselineProfile -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile
      - name: Upload generated profile
        uses: actions/upload-artifact@v4
        with:
          name: android-baseline-profile
          path: packages/android/app/src/release/generated/baselineProfiles/baseline-prof.txt
          if-no-files-found: error
