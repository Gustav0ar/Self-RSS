name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  node-compatibility:
    name: Node 26 Web Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26.5.1"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build the web app with Node
        working-directory: packages/web
        run: node node_modules/vite/bin/vite.js build
      - name: Run web unit tests with Node
        working-directory: packages/web
        run: node node_modules/vitest/vitest.mjs run tests/unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bash -n scripts/*.sh

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: export DATABASE_URL=data/rss.db && bun run db:generate
      - name: Verify generated Drizzle migrations are committed
        run: git diff --exit-code -- packages/api/drizzle
      - run: bun run openapi:generate
      - name: Verify generated OpenAPI is committed
        run: git diff --exit-code -- packages/api/openapi.json
      - run: bun run test
      - name: Verify deployment rollback preserves persistent data
        run: python3 scripts/test_deploy_rollback.py
      - name: Install pinned web Playwright browsers
        run: bun run --filter '@self-feed/web' playwright:install
      - run: bun run test:integration
      - run: bun run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
