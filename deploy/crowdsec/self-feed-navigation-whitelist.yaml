name: selffeed/article-navigation-whitelist
description: "Do not classify successful SelfFeed article navigation as an aggressive crawler"
filter: "evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log']"
whitelist:
  reason: "Authenticated SelfFeed readers legitimately open many distinct article UUIDs"
  expression:
    - >-
      evt.Meta.target_fqdn == 'rss.gustavo.ca' &&
      evt.Meta.http_verb == 'GET' &&
      evt.Meta.http_status in ['200', '304'] &&
      evt.Meta.http_path matches '^/api/v1/articles/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    - >-
      evt.Meta.target_fqdn == 'rss.gustavo.ca' &&
      evt.Meta.http_verb == 'GET' &&
      evt.Meta.http_status in ['200', '304'] &&
      evt.Meta.http_path matches '^/articles/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
